<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Achievements — Alya Rejepov</title>
  <meta name="description" content="Milestones and achievements of Alya Rejepov.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">
  <a class="back-link" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to Alya
  </a>

  <div class="page__inner">
    <h1>Achievements</h1>
    <p class="lede">First milestones are on their way — check back soon.</p>
  </div>
</div>

<footer>
  <span>Alya Rejepov</span>
  <span><span class="paw">&hearts;</span> with Toprak by my side</span>
</footer>

<div class="chat-widget" id="chat-widget">
  <button class="chat-launcher" id="chat-launcher" type="button" aria-expanded="false" aria-controls="chat-panel" aria-label="Open chat about Alya">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  </button>

  <div class="chat-panel" id="chat-panel" hidden>
    <div class="chat-panel__header">
      <span class="chat-panel__title">Ask about Alya</span>
      <button class="chat-panel__close" id="chat-close" type="button" aria-label="Close chat">&times;</button>
    </div>

    <div class="chat-panel__messages" id="chat-messages">
      <div class="chat-msg chat-msg--bot">Hi! I'm Alya's personal assistant. Ask me about her projects, interests, achievements, or goals.</div>
    </div>

    <div class="chat-panel__suggestions" id="chat-suggestions">
      <button class="chat-suggestion" type="button">What's her biggest achievement?</button>
      <button class="chat-suggestion" type="button">What projects has she worked on?</button>
      <button class="chat-suggestion" type="button">What are her future goals?</button>
    </div>

    <form class="chat-panel__form" id="chat-form">
      <input type="text" id="chat-input" placeholder="Ask a question…" autocomplete="off" required aria-label="Your question">
      <button type="submit" id="chat-send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
  </div>
</div>

<script src="cat.js"></script>
<script src="chatbot.js"></script>
</body>
</html>
